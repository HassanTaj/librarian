name: Application checks

on:
  # Opt in manually to conserve private-repository Actions usage; see docs/guides/image-publication.md.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      mongo:
        image: mongo:8.0.34-noble@sha256:3c64937121b9437095921c4bb2569911084c05f7b88e4a263d62a8959d2b2399
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install browser engines
        timeout-minutes: 45
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Build parent revision image for rollback acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/librarian-previous"
          git archive HEAD^ | tar -x -C "$RUNNER_TEMP/librarian-previous"
          docker build --tag librarian:previous "$RUNNER_TEMP/librarian-previous"
      - name: Build local application image
        run: docker build --tag librarian:ci .
      - name: Test standalone application container
        run: npm run test:container
        env:
          LIBRARIAN_TEST_IMAGE: librarian:ci
          LIBRARIAN_PREVIOUS_TEST_IMAGE: librarian:previous
      - run: npm run test:coverage
      - run: npm run coverage:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
