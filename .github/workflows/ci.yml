name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      mongo:
        image: mongo:8.0@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Build local application image
        run: docker build --tag librarian:ci .
      - name: Test standalone application container
        run: npm run test:container
        env:
          LIBRARIAN_TEST_IMAGE: librarian:ci
      - run: npm run test:coverage
      - run: npm run coverage:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
