name: Build and publish Librarian

on:
  push:
    branches:
      - deploy/feed

permissions:
  contents: read

concurrency:
  group: librarian-deploy-feed
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Disposable CI database for integration tests; production uses the existing MongoDB service.
      mongodb:
        image: mongo:8.0@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ping: 1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the production app
        run: npm run build

      - name: Validate generated feature artifacts
        run: npm run validate:artifacts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and integration tests
        run: |
          npm run test:unit
          npm run test:integration

      - name: Measure and enforce coverage
        run: |
          npm run test:coverage
          npm run coverage:check

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: npm run test:e2e

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Validate registry configuration
        shell: bash
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
        run: |
          if [[ -z "$REGISTRY_URL" || "$REGISTRY_URL" == *"://"* || "$REGISTRY_URL" == */* ]]; then
            echo "::error::Set repository secret REGISTRY_URL to a registry host without a scheme or path."
            exit 1
          fi
          image_path="${REGISTRY_IMAGE#"$REGISTRY_URL/"}"
          if [[ "$REGISTRY_IMAGE" != "$REGISTRY_URL/"* || -z "$image_path" || "$image_path" == */ || "$image_path" == *":"* || "$image_path" == *"@"* || "$image_path" == *[[:space:]]* ]]; then
            echo "::error::Set repository secret REGISTRY_IMAGE to REGISTRY_URL/namespace/repository without a tag or digest."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish versioned and watched images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.REGISTRY_IMAGE }}:latest
            ${{ secrets.REGISTRY_IMAGE }}:${{ github.sha }}
            ${{ secrets.REGISTRY_IMAGE }}:v1.0.${{ github.run_number }}
